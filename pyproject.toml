[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gnss-guardian"
version = "0.1.0"
description = "Raspberry Pi edge module: GNSS jamming/spoofing detection with vision fallback navigation (Quectel L86 + Pi Camera)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3",               # pandas 3 changes datetime resolution (ms vs ns); kept from IonWatch
    "numpy>=1.24,<2.5",             # 2.5 deprecates generic timedelta units used inside pandas 2.x
    "pyyaml>=6",
    "click>=8",
    "pyserial>=3.5",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
gnss-guardian = "gnss_guardian.cli:main"

[tool.setuptools.packages.find]
include = ["gnss_guardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
